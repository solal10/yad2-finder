<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0b0f19" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<title>Appartements · Tel-Aviv & environs</title>
<style>
  :root {
    --bg: #0b0f19;
    --card: #151b2b;
    --card2: #1b2237;
    --line: #26304a;
    --text: #e8ecf6;
    --muted: #93a0bd;
    --accent: #4f8cff;
    --new: #23c552;
    --warn: #ffb020;
    --radius: 16px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
  a { color: inherit; text-decoration: none; }

  header {
    position: sticky; top: 0; z-index: 10;
    background: rgba(11,15,25,.9); backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--line);
    padding: calc(env(safe-area-inset-top) + 12px) 16px 12px;
  }
  .title { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
  .title h1 { font-size: 19px; margin: 0; font-weight: 700; letter-spacing: -.2px; }
  .count { font-size: 13px; color: var(--muted); white-space: nowrap; }
  .count b { color: var(--new); }
  .sub { margin-top: 6px; font-size: 12px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .chip { background: var(--card2); border: 1px solid var(--line); border-radius: 999px; padding: 3px 9px; font-size: 11.5px; color: var(--muted); }
  .updated { color: var(--muted); }
  .stale { color: var(--warn); }

  .controls { display: flex; gap: 8px; margin-top: 10px; }
  .controls button {
    flex: 1; background: var(--card2); color: var(--text); border: 1px solid var(--line);
    border-radius: 10px; padding: 8px 6px; font-size: 12.5px; font-weight: 600; cursor: pointer;
    white-space: nowrap;
  }
  .controls button.on { background: var(--accent); border-color: var(--accent); color: #fff; }
  .controls button .badge { opacity: .8; font-weight: 700; }

  main { padding: 12px 12px 40px; display: grid; gap: 12px; max-width: 720px; margin: 0 auto; }

  .card {
    background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
    overflow: hidden; display: block; position: relative;
    transition: transform .08s ease;
  }
  .card:active { transform: scale(.99); }
  .card.seen { opacity: .55; }
  .photo { position: relative; aspect-ratio: 16 / 10; background: var(--card2); overflow: hidden; }
  .photo img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .photo .noimg { display: flex; align-items: center; justify-content: center; height: 100%; color: var(--muted); font-size: 13px; }
  .price {
    position: absolute; inset-block-end: 10px; inset-inline-start: 10px;
    background: rgba(0,0,0,.72); backdrop-filter: blur(4px);
    padding: 6px 11px; border-radius: 10px; font-weight: 800; font-size: 17px;
  }
  .badge-new {
    position: absolute; inset-block-start: 10px; inset-inline-end: 10px;
    background: var(--new); color: #04210f; font-weight: 800; font-size: 11px;
    padding: 4px 9px; border-radius: 999px; letter-spacing: .3px;
  }
  .seenbtn {
    position: absolute; inset-block-start: 10px; inset-inline-start: 10px;
    background: rgba(0,0,0,.66); backdrop-filter: blur(4px); color: #fff;
    border: 1px solid rgba(255,255,255,.22); border-radius: 999px;
    padding: 6px 12px; font-size: 12.5px; font-weight: 700; cursor: pointer; z-index: 5;
  }
  .seenbtn.undo { background: rgba(79,140,255,.9); border-color: transparent; }
  .body { padding: 11px 13px 13px; }
  .addr { font-size: 15px; font-weight: 650; line-height: 1.3; }
  .meta { margin-top: 7px; display: flex; flex-wrap: wrap; gap: 6px; }
  .meta span { font-size: 12.5px; color: var(--muted); background: var(--card2);
    border: 1px solid var(--line); border-radius: 8px; padding: 3px 8px; }
  .tags { margin-top: 8px; display: flex; flex-wrap: wrap; gap: 5px; }
  .tags span { font-size: 11px; color: var(--accent); background: rgba(79,140,255,.1);
    border: 1px solid rgba(79,140,255,.3); border-radius: 999px; padding: 2px 8px; }
  .foot { margin-top: 10px; font-size: 11px; color: var(--muted); display: flex; justify-content: space-between; gap: 8px; }
  .foot .city { direction: rtl; }

  .empty { text-align: center; color: var(--muted); padding: 60px 20px; }
  .refresh-fab {
    position: fixed; inset-block-end: calc(env(safe-area-inset-bottom) + 16px); inset-inline-start: 16px;
    background: var(--accent); color: #fff; border: none; width: 52px; height: 52px; border-radius: 50%;
    font-size: 22px; box-shadow: 0 6px 20px rgba(0,0,0,.4); cursor: pointer; z-index: 20;
  }
  .refresh-fab.spin { animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<header>
  <div class="title">
    <h1>Appartements · Tel-Aviv & environs</h1>
    <div class="count" id="count">…</div>
  </div>
  <div class="sub">
    <span class="chip">4 pièces</span>
    <span class="chip">₪6 500 – 8 000</span>
    <span class="chip">Mamad</span>
    <span class="chip">Parking</span>
    <span class="chip">Ascenseur</span>
  </div>
  <div class="sub"><span id="updated" class="updated">Chargement…</span></div>
  <div class="controls">
    <button id="btnTodo" class="on">À voir</button>
    <button id="btnNew">Nouvelles</button>
    <button id="btnSeen">Vues <span class="badge" id="seenCount"></span></button>
    <button id="btnPrice">Prix</button>
  </div>
</header>

<main id="list"><div class="empty">Chargement des annonces…</div></main>
<button class="refresh-fab" id="fab" aria-label="Rafraîchir">⟳</button>

<script>
const NIS = (n) => n > 0 ? '₪' + n.toLocaleString('fr-FR') : 'Prix non indiqué';
let DATA = null;
let view = 'todo';           // 'todo' | 'new' | 'seen'
let sortPrice = false;

// Annonces marquées "vues" — mémorisées sur cet appareil.
let seen = new Set();
try { seen = new Set(JSON.parse(localStorage.getItem('yad2_seen') || '[]')); } catch (_) {}
function saveSeen() { localStorage.setItem('yad2_seen', JSON.stringify([...seen])); }

function timeAgo(iso) {
  if (!iso) return '';
  const s = Math.floor((Date.now() - new Date(iso)) / 1000);
  if (s < 90) return "à l'instant";
  const m = Math.floor(s / 60);
  if (m < 60) return `il y a ${m} min`;
  const h = Math.floor(m / 60);
  if (h < 24) return `il y a ${h} h`;
  return `il y a ${Math.floor(h / 24)} j`;
}

function render() {
  if (!DATA) return;
  const list = document.getElementById('list');
  const all = DATA.listings || [];
  const notSeen = all.filter(x => !seen.has(x.id));

  let items;
  if (view === 'seen') items = all.filter(x => seen.has(x.id));
  else if (view === 'new') items = notSeen.filter(x => x.isNew);
  else items = notSeen.slice();

  if (sortPrice) {
    const k = p => p > 0 ? p : Infinity;
    items.sort((a, b) => k(a.price) - k(b.price));
  }

  const newToReview = notSeen.filter(x => x.isNew).length;
  document.getElementById('count').innerHTML =
    `${notSeen.length} à voir · <b>${newToReview} nouvelles</b>`;
  const sc = all.filter(x => seen.has(x.id)).length;
  document.getElementById('seenCount').textContent = sc ? `(${sc})` : '';

  const upd = document.getElementById('updated');
  const ok = DATA.lastRunOk !== false;
  upd.className = ok ? 'updated' : 'stale';
  upd.textContent = ok
    ? 'Mis à jour ' + timeAgo(DATA.updatedAt)
    : '⚠ Échec de la dernière mise à jour · données du ' + timeAgo(DATA.updatedAt);

  if (!items.length) {
    const msg = view === 'seen' ? 'Aucune annonce masquée'
      : view === 'new' ? 'Aucune nouvelle annonce'
      : 'Tout est vu 🎉';
    list.innerHTML = `<div class="empty">${msg}</div>`;
    return;
  }
  list.innerHTML = items.map(cardHTML).join('');
}

function cardHTML(x) {
  const isSeen = seen.has(x.id);
  const img = x.image
    ? `<img loading="lazy" src="${x.image}" onerror="this.parentNode.innerHTML='<div class=noimg>Pas de photo</div>'" />`
    : `<div class="noimg">Pas de photo</div>`;
  const meta = [
    x.rooms ? `${x.rooms} pièces` : null,
    x.sqm ? `${x.sqm} m²` : null,
    (x.floor != null) ? `Étage ${x.floor}` : null,
    x.adType === 'private' ? 'Particulier' : (x.adType ? 'Agence' : null),
  ].filter(Boolean).map(t => `<span>${t}</span>`).join('');
  const tags = (x.tags || []).slice(0, 4).map(t => `<span dir="rtl">${t}</span>`).join('');
  const seenBtn = isSeen
    ? `<span class="seenbtn undo" data-act="unsee" data-id="${x.id}">↩ Annuler</span>`
    : `<span class="seenbtn" data-act="see" data-id="${x.id}">✓ Vu</span>`;
  return `
  <a class="card ${isSeen ? 'seen' : ''}" href="${x.url}" target="_blank" rel="noopener">
    <div class="photo">
      ${img}
      ${seenBtn}
      <div class="price">${NIS(x.price)}</div>
      ${x.isNew && !isSeen ? '<div class="badge-new">NOUVEAU</div>' : ''}
    </div>
    <div class="body">
      <div class="addr" dir="rtl">${x.address || x.city || 'Adresse inconnue'}</div>
      <div class="meta">${meta}</div>
      ${tags ? `<div class="tags">${tags}</div>` : ''}
      <div class="foot"><span class="city">${x.city || ''}</span><span>Vu ${timeAgo(x.firstSeen)}</span></div>
    </div>
  </a>`;
}

// Clic sur "Vu"/"Annuler" : on n'ouvre PAS l'annonce.
document.getElementById('list').addEventListener('click', (e) => {
  const btn = e.target.closest('[data-act]');
  if (!btn) return;
  e.preventDefault();
  e.stopPropagation();
  const id = btn.dataset.id;
  if (btn.dataset.act === 'see') seen.add(id);
  else seen.delete(id);
  saveSeen();
  render();
});

async function load() {
  const fab = document.getElementById('fab');
  fab.classList.add('spin');
  try {
    const res = await fetch('listings.json?t=' + Date.now(), { cache: 'no-store' });
    DATA = await res.json();
    render();
  } catch (e) {
    if (!DATA) document.getElementById('list').innerHTML =
      '<div class="empty">Erreur de chargement des données</div>';
  } finally {
    setTimeout(() => fab.classList.remove('spin'), 400);
  }
}

function setBtns() {
  document.getElementById('btnTodo').classList.toggle('on', view === 'todo');
  document.getElementById('btnNew').classList.toggle('on', view === 'new');
  document.getElementById('btnSeen').classList.toggle('on', view === 'seen');
  document.getElementById('btnPrice').classList.toggle('on', sortPrice);
}
document.getElementById('btnTodo').onclick = () => { view = 'todo'; setBtns(); render(); };
document.getElementById('btnNew').onclick = () => { view = 'new'; setBtns(); render(); };
document.getElementById('btnSeen').onclick = () => { view = 'seen'; setBtns(); render(); };
document.getElementById('btnPrice').onclick = () => { sortPrice = !sortPrice; setBtns(); render(); };
document.getElementById('fab').onclick = load;

load();
setInterval(load, 5 * 60 * 1000);          // rafraîchit les données toutes les 5 min
document.addEventListener('visibilitychange', () => { if (!document.hidden) load(); });
</script>
</body>
</html>
